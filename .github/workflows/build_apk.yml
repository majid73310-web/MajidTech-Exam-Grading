name: Build MajidTech Exam APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to manually trigger a build anytime from GitHub

jobs:
  build-apk:
    name: Build Release APK on Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (Required for Android/Gradle builds)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the Flutter SDK
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Uses the latest stable Flutter 3 release
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 4. Install dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 5. Build the Release APK 
      # (Optional: If you store your Gemini API key in GitHub Secrets, append: --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }})
      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      # 6. Upload the built APK as a downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MajidTech-Exam-Grader-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
