name: majidtech_exam_grading
description: "MajidTech Exam Grading - AI-Powered Bilingual Automated Exam Scanner & Grading App for Android"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Vision & AI SDK (Gemini 1.5 Flash)
  google_generative_ai: ^0.4.6

  # Local SQLite Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Camera, Haptics & Native Hardware
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  vibration: ^2.0.0

  # Internationalization & Storage
  intl: ^0.19.0
  path_provider: ^2.1.3
  csv: ^6.0.0
  excel: ^4.0.3
  share_plus: ^9.0.0

  # Typography & UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sample_keys/
    - assets/templates/
